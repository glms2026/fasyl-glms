# Test profile: in-memory H2 (PostgreSQL compatibility mode)
# so the full Spring context boots without an external database.

spring.datasource.url=jdbc:h2:mem:glms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# System users seeded by DatabaseInitializer
admin.username = admin#@$
admin.password = admin133&

control.username = control#
control.password = controlER3829

authorizer.username = @authorizer
authorizer.password = authorize10029

creator.username = )creator
creator.password = creator+5@#

# JWT configuration for the test profile
app.jwt.secret=integration-test-secret-key-that-is-at-least-256-bits-long-0123456789
app.jwt.expiration=900000
app.jwt.refresh-expiration=86400000
