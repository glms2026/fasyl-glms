spring.application.name=general-ledger-management-system
server.port=8083





# Default System Users
admin.username = ${ADMIN_USERNAME}
admin.password = ${ADMIN_PASSWORD}

control.username = ${CONTROL_USERNAME}
control.password = ${CONTROL_PASSWORD}

authorizer.username = ${AUTHORIZER_USERNAME}
authorizer.password = ${AUTHORIZER_PASSWORD}

creator.username = ${CREATOR_USERNAME}
creator.password = ${CREATOR_PASSWORD}







# Postgresql Database
app.datasource.url=${DATABASE_URL}
app.datasource.username=${DATABASE_USERNAME}
app.datasource.password=${DATABASE_PASSWORD}
app.datasource.driver-class-name=org.postgresql.Driver

# Postgresql JPA / Hibernate
app.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.jpa.hibernate.ddl-auto=update


# Oracle - existing/reference database (read-only)
app.datasource.oracle.url=${ORACLE_DATABASE_URL}
app.datasource.oracle.username=${ORACLE_DATABASE_USERNAME}
app.datasource.oracle.password=${ORACLE_DATABASE_PASSWORD}
app.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver

app.jpa.show-sql=true
app.jpa.properties.hibernate.format_sql=true



# Logging

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG


# JWT Configuration

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration=${REFRESH_EXPIRATION}


# Swagger/OpenAPI Configuration

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method


# Account Lock Configuration

# Default lock duration (in minutes) when the maker does not
# specify one. The account is auto-unlocked after this time
# without any approval.
security.account.lock-duration-minutes=${LOCK_DURATION_MINUTES:60}

# Maximum lock duration a maker may request (in minutes).
security.account.lock-max-minutes=${LOCK_MAX_MINUTES:60}
