spring.application.name=general-ledger-management-system
server.port=8083





# Default System Users
admin.username = ${ADMIN_USERNAME}
admin.password = ${ADMIN_PASSWORD}

control.username = ${CONTROL_USERNAME}
control.password = ${CONTROL_PASSWORD}

authorizer.username = ${AUTHORIZER_USERNAME}
authorizer.password = ${AUTHORIZER_PASSWORD}

creator.username = ${CREATOR_USERNAME}
creator.password = ${CREATOR_PASSWORD}







# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update



app.jpa.show-sql=true
app.jpa.properties.hibernate.format_sql=true


# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=60000



# Logging

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG


# JWT Configuration

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration=${REFRESH_EXPIRATION}


# Swagger/OpenAPI Configuration

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method


# Account Lock Configuration

# Default lock duration (in minutes) when the maker does not
# specify one. The account is auto-unlocked after this time
# without any approval.
security.account.lock-duration-minutes=${LOCK_DURATION_MINUTES:60}

# Maximum lock duration a maker may request (in minutes).
security.account.lock-max-minutes=${LOCK_MAX_MINUTES:60}
