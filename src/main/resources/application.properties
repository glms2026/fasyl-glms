spring.application.name=general-ledger-management-system
server.port=8083


#app.jwt.secret=9a4f2c8d3e7b1a5c6e8f9d0a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u
#app.jwt.access-expiration= 900000 # 15 Minutes
#app.jwt.refresh-expiration= 86400000 # 24 Hours


# Default Admin User
admin.username = admin
admin.password = admin123

# Default Normal User
user.username = user
user.password = user123






# Oracle Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Logging

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG


# JWT Configuration

app.jwt.secret=${JWT_SERECT}

app.jwt.expiration=${JWT_EXPIRATION}


# Swagger/OpenAPI Configuration

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method
